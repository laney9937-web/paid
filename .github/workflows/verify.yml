name: verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - repair/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # GitHub-hosted ubuntu-latest is preferred. This account is currently
    # billing-locked ("job was not started because your account is locked due
    # to a billing issue"), so the job runs on a registered Linux self-hosted
    # runner until hosted minutes are unlocked.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      CI: "true"
      DATABASE_URL: postgres://paid:paid_local_only@127.0.0.1:5432/paid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          node -v
          pnpm -v
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Env
        run: cp .env.example .env
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Playwright browser
        run: pnpm exec playwright install chromium
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Verify
        run: pnpm verify
      - name: SBOM
        run: pnpm sbom
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            docs/evidence/sbom.json
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
