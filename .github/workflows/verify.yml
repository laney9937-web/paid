name: verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - repair/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: paid
          POSTGRES_PASSWORD: paid_local_only
          POSTGRES_DB: paid
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U paid -d paid" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Env
        run: cp .env.example .env
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Verify
        run: pnpm verify
      - name: SBOM
        run: pnpm sbom
