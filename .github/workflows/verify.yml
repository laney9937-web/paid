name: verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - repair/**
  workflow_dispatch:

permissions:
  contents: read

# One self-hosted runner shares Postgres and TCP ports with the workspace.
# Serialize every verify job so overlapping PR/push runs cannot contend.
concurrency:
  group: paid-verify
  cancel-in-progress: true

jobs:
  verify:
    # GitHub-hosted ubuntu-latest is preferred. This account is currently
    # billing-locked ("job was not started because your account is locked due
    # to a billing issue"), so the job runs on a registered Linux self-hosted
    # runner until hosted minutes are unlocked.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      CI: "true"
      E2E_WEB_PORT: "3100"
      E2E_OPS_PORT: "3101"
      DATABASE_URL: postgres://paid:paid_local_only@127.0.0.1:5432/paid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free isolated e2e ports
        run: |
          for p in 3100 3101; do
            if command -v fuser >/dev/null 2>&1; then
              fuser -k "${p}/tcp" 2>/dev/null || true
            fi
          done
          pkill -f 'next start --port 3100' 2>/dev/null || true
          pkill -f 'next start --port 3101' 2>/dev/null || true
          sleep 1
      - name: Show toolchain
        run: |
          node -v
          pnpm -v
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Env
        run: cp .env.example .env
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Playwright browser
        run: pnpm exec playwright install chromium
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Verify
        run: pnpm verify
      - name: SBOM
        run: pnpm sbom
