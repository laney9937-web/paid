services:
  postgres:
    image: postgres:18.6-alpine
    container_name: paid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paid
      POSTGRES_PASSWORD: paid_local_only
      POSTGRES_DB: paid
    ports:
      - '5432:5432'
    volumes:
      - paid_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paid -d paid']
      interval: 3s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500

volumes:
  paid_pg_data:
